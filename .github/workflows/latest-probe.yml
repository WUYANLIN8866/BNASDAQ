name: latest-probe (temporary)
on:
  push:
    branches: [hm-dev]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the new latest-closes script (results stay on this branch)
        run: |
          set +e
          START=$(date +%s)
          python3 scripts/fetch_latest.py > probe-latest.log 2>&1
          echo "exit $? seconds $(( $(date +%s) - START ))" >> probe-latest.log
          python3 scripts/probe_summary.py >> probe-latest.log 2>&1
          true
      - name: Save results to this branch
        run: |
          git config user.name "bnasdaq-bot"
          git config user.email "bnasdaq-bot@users.noreply.github.com"
          git add -f probe-latest.log data/tw/latest.json data/lt/us-close.json || true
          git commit -m "probe result" || exit 0
          git push origin HEAD:hm-dev
