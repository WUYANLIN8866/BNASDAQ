name: probe realtime sources (temporary)
on:
  push:
    branches: [probe-live-20261124]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
      - name: cnyes
        run: timeout 200 python3 scripts/_probe_rt2.py cnyes 2>&1 | cut -c1-3200
      - name: misc
        if: always()
        run: timeout 120 python3 scripts/_probe_rt2.py misc 2>&1 | cut -c1-3700
      - name: cnyesjs
        if: always()
        run: timeout 240 python3 scripts/_probe_rt2.py cnyesjs 2>&1 | cut -c1-600
