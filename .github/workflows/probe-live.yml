name: probe realtime sources (temporary)
on:
  push:
    branches: [probe-live-20261124]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
      - name: cnyesjs
        run: timeout 280 python3 -u scripts/_probe_rt3.py 2>&1 | cut -c1-400
