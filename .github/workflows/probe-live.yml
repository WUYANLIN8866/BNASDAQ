name: probe realtime sources (temporary)
on:
  push:
    branches: [probe-live-20261124]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
      - name: tw fields
        run: timeout 120 python3 scripts/_probe_rt.py tw 2>&1 | cut -c1-600
      - name: cors
        if: always()
        run: timeout 120 python3 scripts/_probe_rt.py cors 2>&1 | cut -c1-900
      - name: yahoo page
        if: always()
        run: timeout 240 python3 scripts/_probe_rt.py page 2>&1 | cut -c1-2500
