name: probe realtime sources (temporary)
on:
  push:
    branches: [probe-live-20261124]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
      - name: fixtures
        run: timeout 280 python3 -u scripts/_probe_rt4.py 2>&1 | cut -c1-2700
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx
          path: fx
          retention-days: 3
