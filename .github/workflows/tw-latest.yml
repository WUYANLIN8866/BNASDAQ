name: Update latest closes (TW official + US Yahoo)

on:
  workflow_dispatch:
  schedule:
    # 週一～週五 07:10 UTC（台北 15:10），台股 13:30 收盤後；證交所 OpenAPI 延遲時程式改用 Yahoo（.TW）同日收盤
    - cron: '10 7 * * 1-5'
    # 週一～週五 21:40 UTC（台北隔天 05:40），美股收盤後：早上看每日市場分析時美股已是最新收盤（程式只收已收盤的 K 棒）
    - cron: '40 21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tw-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest closes (TWSE + TPEx official)
        run: python3 scripts/fetch_latest.py
      - name: Commit if changed
        run: |
          git config user.name "bnasdaq-bot"
          git config user.email "bnasdaq-bot@users.noreply.github.com"
          git add data/tw/latest.json data/tw/_fx.json
          if git diff --cached --quiet; then
            echo "latest.json unchanged"
          else
            ASOF=$(python3 -c "import json;print(json.load(open('data/tw/latest.json'))['asof'].get('TW',''))")
            git commit -m "data: tw latest ${ASOF}"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
