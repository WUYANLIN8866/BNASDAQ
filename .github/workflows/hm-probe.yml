name: hm-probe (temporary)
on:
  push:
    branches: [hm-probe]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe intraday quote sources from a runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 probe2.py
      - name: Save result to this branch
        if: always()
        run: |
          git config user.name "bnasdaq-bot"
          git config user.email "bnasdaq-bot@users.noreply.github.com"
          git add -f out || true
          git commit -m "probe result" || exit 0
          git push origin HEAD:hm-probe
