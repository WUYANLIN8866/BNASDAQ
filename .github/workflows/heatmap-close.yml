name: Heatmap close snapshot (all symbols)

# 收盤後補一份「全部代號」的當日收盤快照（台股全上市／全上櫃也用當天收盤，和台灣 50 同一天）。
# 盤中程式正常跑完時快照已完整，這裡會直接略過。
on:
  workflow_dispatch:
    inputs:
      market:
        description: TW or US
        default: TW
      force:
        description: 'true = 已完整也重發'
        default: 'false'
  schedule:
    - cron: '5 6 * * 1-5'    # 台北 14:05（收盤 13:30 之後）

permissions:
  contents: write

concurrency:
  group: heatmap-close
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data/heatmap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish a closed snapshot with every symbol
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET: ${{ inputs.market || 'TW' }}
        run: python3 scripts/heatmap_live.py close ${{ inputs.force == 'true' && '--force' || '' }}
