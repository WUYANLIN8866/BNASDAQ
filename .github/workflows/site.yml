name: Update market data and deploy site

on:
  push:
    branches: [main]
  schedule:
    # 每個交易日美股收盤後（22:45 UTC ＝ 台北 06:45；夏令美股 20:00 UTC 收盤、冬令 21:00 UTC 收盤）
    - cron: '45 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optional data libraries
        run: pip install --quiet yfinance || true

      - name: Fetch QQQ market data (public prices only)
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_market.py

      - name: Fetch QQQ daily volatility pool for member forecasts (public data only)
        continue-on-error: true
        run: python3 scripts/fetch_fhs.py

      - name: Fetch US Treasury yields (public data only)
        id: fetch_tsy
        continue-on-error: true
        run: python3 scripts/fetch_treasury.py

      - name: Fetch FRED TB3MS (public data only; homepage backtest T-bill for new months)
        continue-on-error: true
        run: python3 scripts/fetch_tb3ms.py

      - name: Fetch homepage comparison series to the last complete month (public data only)
        continue-on-error: true
        run: python3 scripts/fetch_home.py

      - name: Fetch market-cap heatmap for the daily page (public data only; skips if already up to date)
        continue-on-error: true
        run: python3 scripts/fetch_heatmap.py

      - name: Commit public market data if it changed
        run: |
          git config user.name "bnasdaq-bot"
          git config user.email "bnasdaq-bot@users.noreply.github.com"
          for f in data/market.json data/treasury.json data/market_daily.json data/tb3ms.json data/home.json data/qqq_fhs.json data/heatmap/latest.json data/treasury_curve.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "market data unchanged"
          else
            ASOF=$(python3 -c "import json;print(max(json.load(open('data/market.json'))['asof'], json.load(open('data/treasury.json')).get('asof') or ''))")
            git commit -m "data: market update ${ASOF}"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
