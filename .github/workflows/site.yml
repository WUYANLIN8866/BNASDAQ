name: Update market data and deploy site

on:
  push:
    branches: [main]
  schedule:
    # 每個交易日美股收盤後（22:45 UTC ＝ 台北 06:45；夏令美股 20:00 UTC 收盤、冬令 21:00 UTC 收盤）
    - cron: '45 22 * * 1-5'
    # 2026-11-25 站主：「更新的時間應該設在官方公布後就自動更新」。美國官方數據多在美東 08:30（CPI、PPI、個人所得與支出）或 09:15（G.17）公布；
    # 下面三個時段是公布後 20～95 分鐘（冬令、夏令都涵蓋，後面的時段兼作重試）。gate 會先看 data/release-calendar.json：
    # 剛剛沒有官方公布就整個略過，不抓資料也不部署。美東下午才公布的（匯率、利差月平均等）由上面 22:45 那一次接到。
    - cron: '50 12 * * 1-5'
    - cron: '50 13 * * 1-5'
    - cron: '50 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/release_due.py
            data/release-calendar.json
          sparse-checkout-cone-mode: false
      - id: g
        name: Run unless this is an official-release time slot with no release just published
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "45 22 * * 1-5" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif python3 scripts/release_due.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check strategy codes on public pages (generic or outdated names block the deploy)
        run: python3 scripts/strategy_names.py --check

      - name: Check daily market report dates (Taipei date, no overwrite; reported, never blocks the deploy)
        continue-on-error: true
        run: python3 scripts/check_daily.py

      - name: Install optional data libraries
        run: pip install --quiet yfinance || true

      - name: Fetch QQQ market data (public prices only)
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_market.py

      - name: Fetch QQQ daily volatility pool for member forecasts (public data only)
        continue-on-error: true
        run: python3 scripts/fetch_fhs.py

      - name: Fetch US Treasury yields (public data only)
        id: fetch_tsy
        continue-on-error: true
        run: python3 scripts/fetch_treasury.py

      - name: Fetch FRED TB3MS (public data only; homepage backtest T-bill for new months)
        continue-on-error: true
        run: python3 scripts/fetch_tb3ms.py

      - name: Fetch FRED monthly series group, encrypted for members and the private generator (public data only; keeps month-end snapshots)
        continue-on-error: true
        run: |
          pip install --quiet cryptography || true
          python3 scripts/fetch_macro.py

      - name: Fetch homepage comparison series to the last complete month (public data only)
        continue-on-error: true
        run: python3 scripts/fetch_home.py

      - name: Fetch market-cap heatmap for the daily page (public data only; skips if already up to date)
        continue-on-error: true
        run: python3 scripts/fetch_heatmap.py

      - name: Accumulate Taiwan insider transfer declarations (TWSE open data; public)
        continue-on-error: true
        run: python3 scripts/fetch_tw_insider.py

      - name: Commit public market data if it changed
        run: |
          git config user.name "bnasdaq-bot"
          git config user.email "bnasdaq-bot@users.noreply.github.com"
          for f in data/market.json data/treasury.json data/market_daily.json data/tb3ms.json data/macro.enc.json data/macro2.enc.json data/macro-status.json data/home.json data/qqq_fhs.json data/heatmap/latest.json data/treasury_curve.json data/company/_tw_insider.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if [ -d data/macro2 ]; then git add data/macro2; fi
          if git diff --cached --quiet; then
            echo "market data unchanged"
          else
            ASOF=$(python3 -c "import json;print(max(json.load(open('data/market.json'))['asof'], json.load(open('data/treasury.json')).get('asof') or ''))")
            git commit -m "data: market update ${ASOF}"
            # 兩次執行排隊時，後面那次是從較舊的提交開始的；每次都會重寫的資料檔會衝突。衝突一律以這次剛產生的資料為準（rebase 的 theirs＝正在重放的這個提交），
            # 推送被拒就重抓再試；三次都不行也不擋部署（下次執行會重新產生同樣的資料）。
            pushed=0
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main || git rebase --abort || true
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "::warning::data commit was not pushed; it will be regenerated by the next run"; fi
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
