name: Probe TW sources (temporary)
# 一次性：探測台股全上市／全上櫃熱力圖的資料來源欄位（2026-11-20）。結果放 artifact；確認完就刪掉這個檔與 scripts/probe/。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe/tw_sources.py
        timeout-minutes: 6
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-tw
          path: probe_out/
