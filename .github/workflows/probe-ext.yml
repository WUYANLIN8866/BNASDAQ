name: Probe extended hours (temporary)

# 暫時性實測：只在 probe-ext-hours 分支被推送時執行。
on:
  push:
    branches: [probe-ext-hours]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data/heatmap
            data/daily
            data/tw
      - name: What Yahoo returns right now
        run: python3 scripts/probe_today.py
      - name: Production code, one pre-market round
        working-directory: main
        run: python3 scripts/heatmap_live.py once --market US --ext pre || true
