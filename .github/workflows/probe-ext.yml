name: Probe extended hours (temporary)

# 暫時性實測：只在 probe-ext-hours 分支被推送時執行。
on:
  push:
    branches: [probe-ext-hours]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data/heatmap
            data/daily
      - name: Board (pre-market) from the real feed
        run: python3 scripts/heatmap_live.py once --market US --board pre
      - name: News (print only, no publish)
        run: python3 scripts/heatmap_live.py news --print
