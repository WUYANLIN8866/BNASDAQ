name: Look-through source probe 8 (temporary)
on:
  push:
    branches: [lookthrough-probe8]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: |
          B=https://wuyanlin8866.github.io/BNASDAQ
          echo "CHK company 檔案：$(curl -s "$B/data/company/_universe.json?t=$(date +%s)" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(len(d["list"]),d["updated"])')"
          cat > live.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => { const b = await chromium.launch(); const errs = []; const B = process.argv[2];
            const p = await b.newPage({ viewport: { width: 1600, height: 1000 } }); p.on('pageerror', e => errs.push(e.message));
            await p.goto(B + 'daily.html?t=' + Date.now(), { waitUntil: 'networkidle' }); await p.waitForTimeout(1200);
            const t = await p.$('#hm-box .tl[data-s="NVDA"]'); await t.scrollIntoViewIfNeeded(); await p.waitForTimeout(300);
            await Promise.all([p.waitForNavigation({ waitUntil: 'networkidle' }), t.click()]); await p.waitForTimeout(3000);
            for (const c of ['NVDA', '2317', '2330', 'JPM']) {
              if (c !== 'NVDA') { await p.goto(B + 'valuation.html?t=' + Date.now() + '#code=' + c, { waitUntil: 'networkidle' }); await p.waitForTimeout(3000); }
              const r = await p.evaluate(() => ({ url: location.hash, am: document.body.classList.contains('am'), param: getComputedStyle(document.querySelector('#vf').closest('.panel')).display, verdict: (document.querySelector('#vOut .big') || {}).textContent,
                h3: document.querySelectorAll('#detail h3').length, radar: document.querySelectorAll('#dCo .radar polygon.rp').length, scoreRows: document.querySelectorAll('#dCo .sct tbody tr').length,
                hold: (document.getElementById('co-hold') && document.getElementById('co-hold').nextElementSibling || {}).innerText, share: (document.querySelector('#co-share + p') || {}).innerText }));
              console.log('CHK 線上', c, JSON.stringify(r).slice(0, 700));
            }
            console.log('CHK 頁面錯誤', errs.length ? errs : '無'); await b.close(); })();
          JS
          node live.js $B/
