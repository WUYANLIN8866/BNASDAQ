name: Look-through source probe 8 (temporary)
on:
  push:
    branches: [lookthrough-probe8]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p data/lt/etf data/heatmap
          for e in QQQ IVV SPY SOXQ; do curl -sL "https://raw.githubusercontent.com/WUYANLIN8866/BNASDAQ/main/data/lt/etf/$e.json" -o "data/lt/etf/$e.json"; done
          curl -sL "https://raw.githubusercontent.com/WUYANLIN8866/BNASDAQ/main/data/lt/universe.json" -o data/lt/universe.json
          python3 scripts/fetch_heatmap.py --force
          python3 - <<'PY'
          import json
          d = json.load(open('data/heatmap/latest.json'))
          s = d['sets']['sox']; print('SOX', s['n'], s['cap_total_bn'], [(t[0], t[1], t[3], t[4]) for t in s['tiles'][:8]])
          print('SOX 估算', [t[0] for t in s['tiles'] if t[6]], '沒漲跌', [t[0] for t in s['tiles'] if t[4] is None])
          PY
      - run: echo "HMJSON:$(base64 -w0 data/heatmap/latest.json)"
