name: Look-through source probe 8 (temporary)
on:
  push:
    branches: [lookthrough-probe8]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: |
          B=https://wuyanlin8866.github.io/BNASDAQ
          for f in member.html admin.html; do echo "$f：rules-status 參照 $(curl -s $B/$f | grep -c 'rules-status.json') 次、通用版標記 $(curl -s $B/$f | grep -c 'rules.STRATEGIES') 次"; done
          echo "member.html 同步說明：$(curl -s $B/member.html | grep -o '每天自動比對專案 B 區兩次' | head -1)"
          echo "rules-status.json HTTP $(curl -s -o /dev/null -w '%{http_code}' $B/data/rules-status.json)"
          echo "rules.enc.json 開頭：$(curl -s $B/data/rules.enc.json | head -c 30)"
          echo "rules-key.json HTTP $(curl -s -o /dev/null -w '%{http_code}' $B/data/rules-key.json)"
          echo "qqq_fhs.json：$(curl -s $B/data/qqq_fhs.json | head -c 90)"
          cat > /tmp/nologin.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => { const b = await chromium.launch(); const p = await b.newPage(); const errs = []; p.on('pageerror', e => errs.push(e.message));
            await p.goto(process.argv[2] + 'member.html', { waitUntil: 'networkidle' }); console.log('未登入開 member.html → 停在', p.url().split('/').pop());
            await p.goto(process.argv[2] + 'admin.html', { waitUntil: 'networkidle' }); console.log('未登入開 admin.html → 停在', p.url().split('/').pop());
            console.log('頁面錯誤：', errs.length ? errs : '無'); await b.close(); })();
          EOF
          cp /tmp/nologin.js ./nologin.js && node nologin.js $B/
