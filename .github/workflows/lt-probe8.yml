name: Look-through source probe 8 (temporary)
on:
  push:
    branches: [lookthrough-probe8]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install -q pypdf
          git fetch -q origin main && git checkout origin/main -- data/heatmap/latest.json data/fund
          python3 scripts/fetch_company.py --codes NVDA,AMD,AVGO,INTC,TSM,QCOM,MU,AAPL,MSFT,JPM,BRK-B,2330,2317,2454,2881,2308,2412
          tar czf /tmp/co.tgz data/company
          ls -la data/company | head -30
          echo "COTGZ:$(base64 -w0 /tmp/co.tgz)"
