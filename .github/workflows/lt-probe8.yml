name: Look-through source probe 8 (temporary)
on:
  push:
    branches: [lookthrough-probe8]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: |
          B=https://wuyanlin8866.github.io/BNASDAQ
          T=$(date +%s)
          echo "CHK site.css 最大寬度：$(curl -s "$B/assets/site.css?t=$T" | grep -o -- '--maxw: [0-9]*px' | head -1)"
          echo "CHK daily.html 熱力圖區塊：$(curl -s "$B/daily.html?t=$T" | grep -c 'id=\"hm-box\"')"
          echo "CHK 選單順序（daily）：$(curl -s "$B/daily.html?t=$T" | grep -o '<ul id="mainmenu">.*</ul>' | sed 's/<[^>]*>/|/g' | tr -s '|' | cut -c1-220)"
          echo "CHK member.html 我的持有資產：$(curl -s "$B/member.html?t=$T" | grep -c 'id=\"mh\"')"
          echo "CHK heatmap 資料：$(curl -s "$B/data/heatmap/latest.json?t=$T" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["session"],{k:v["n"] for k,v in d["sets"].items()})')"
          echo "CHK 會員規則：$(curl -s "$B/data/rules.enc.json?t=$T" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("schema"),d.get("b_ver"),d.get("strategies"))')"
          echo "CHK 同步狀態：$(curl -s "$B/data/rules-status.json?t=$T" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("state"),d.get("b_ver"))')"
          cat > live.js <<'JS'
          const { chromium } = require('playwright');
          (async () => { const b = await chromium.launch(); const errs = [];
            const p = await b.newPage({ viewport: { width: 1920, height: 1080 } }); p.on('pageerror', e => errs.push(e.message));
            await p.goto(process.argv[2] + 'daily.html?t=' + Date.now(), { waitUntil: 'networkidle' }); await p.waitForTimeout(1500);
            const r = await p.evaluate(() => ({ tiles: document.querySelectorAll('#hm-box .tl').length, meta: (document.getElementById('hm-meta') || {}).textContent, wrap: Math.round(document.querySelector('.main .wrap').getBoundingClientRect().width), nav: [...document.querySelectorAll('#mainmenu a')].map(a => a.textContent.trim()).join('|') }));
            console.log('CHK 線上熱力圖方塊', r.tiles, '｜', r.meta, '｜內容寬', r.wrap);
            await p.addInitScript(() => sessionStorage.setItem('bn-session', JSON.stringify({ user: 'probe', role: 'member', ck: 'AAAA' })));
            await p.goto(process.argv[2] + 'about.html?t=' + Date.now(), { waitUntil: 'networkidle' });
            console.log('CHK 登入後選單', await p.evaluate(() => [...document.querySelectorAll('#mainmenu a')].map(a => a.textContent.trim()).join('|')));
            console.log('CHK 頁面錯誤', errs.length ? errs : '無'); await b.close(); })();
          JS
          node live.js $B/
