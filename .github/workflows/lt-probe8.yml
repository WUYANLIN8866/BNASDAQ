name: Look-through source probe 8 (temporary)
on:
  push:
    branches: [lookthrough-probe8]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: |
          B=https://wuyanlin8866.github.io/BNASDAQ
          echo "線上 daily/index.json latest：$(curl -s "$B/data/daily/index.json?t=$(date +%s)" | python3 -c 'import json,sys;print(json.load(sys.stdin)["latest"])')"
          echo "線上 market.json asof：$(curl -s "$B/data/market.json?t=$(date +%s)" | python3 -c 'import json,sys;print(json.load(sys.stdin)["asof"])')"
          cat > dailycheck.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => { const b = await chromium.launch(); const p = await b.newPage(); const errs = []; p.on('pageerror', e => errs.push(e.message));
            await p.goto(process.argv[2] + 'daily.html', { waitUntil: 'networkidle' }); await p.waitForTimeout(1500);
            const t = await p.evaluate(() => document.body.innerText);
            console.log('網頁含 2026-11-10：', t.includes('2026-11-10'), '｜含 11/9 那指 27,907.63：', /27,?907\.63/.test(t));
            console.log('網頁開頭：', t.replace(/\s+/g, ' ').slice(t.replace(/\s+/g, ' ').indexOf('每日市場分析'), t.replace(/\s+/g, ' ').indexOf('每日市場分析') + 160));
            console.log('頁面錯誤：', errs.length ? errs : '無'); await b.close(); })();
          EOF
          node dailycheck.js $B/
