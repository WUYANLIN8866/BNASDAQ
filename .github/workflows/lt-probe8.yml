name: Look-through source probe 8 (temporary)
on:
  push:
    branches: [lookthrough-probe8]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p data/lt/etf data/heatmap
          for e in QQQ IVV SPY; do curl -sL "https://raw.githubusercontent.com/WUYANLIN8866/BNASDAQ/main/data/lt/etf/$e.json" -o "data/lt/etf/$e.json"; done
          time python3 scripts/fetch_heatmap.py --force
          python3 - <<'PY'
          import json
          d = json.load(open('data/heatmap/latest.json'))
          print('session', d['session'], 'notes', d['notes'][:10])
          for k, s in d['sets'].items():
              t = s['tiles']; print(k, s['name'], 'n', s['n'], 'cap_total_bn', s['cap_total_bn'], 'holdings', s['holdings_asof'])
              print('  估算市值', [x[0] for x in t if x[6]][:20], '| 沒漲跌', [x[0] for x in t if x[4] is None][:20])
              for sym in ['NVDA', 'AAPL', 'MSFT', 'GOOGL', 'AMZN', 'META', 'AVGO', 'TSLA', 'BRK-B', 'FOXA', 'NWSA']:
                  r = [x for x in t if x[0] == sym]
                  if r: print('  ', r[0])
          PY
      - run: echo "HMJSON:$(base64 -w0 data/heatmap/latest.json)"
