name: Look-through source probe 8 (temporary)
on:
  push:
    branches: [lookthrough-probe8]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: |
          B=https://wuyanlin8866.github.io/BNASDAQ
          echo "CHK 2330 資料：$(curl -s "$B/data/company/2330.json?t=$(date +%s)" | python3 -c 'import json,sys;d=json.load(sys.stdin);t=d.get("tw") or {};print(d["updated"], "esg" in t, t.get("twse_val"), (t.get("twse_margin") or {}).get("q"))')"
          echo "CHK 內部人累積：$(curl -s "$B/data/company/_tw_insider.json?t=$(date +%s)" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["since"], d["updated"], len(d["rows"]))')"
          node probe/live2.js $B/
