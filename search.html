<div class="main"><div class="wrap">
  <form class="search" id="sf" role="search" style="max-width:560px"><label class="sr-only" for="q2">關鍵字</label><input id="q2" type="search" placeholder="例：最大回撤、0050、2,000 萬"><button type="submit">搜尋</button></form>
  <div id="res" style="margin-top:20px"></div>
</div></div>
<script>
(function(){const idx=window.SEARCH_INDEX||[];const q0=new URLSearchParams(location.search).get('q')||'';const inp=document.getElementById('q2');inp.value=q0;
function run(q){const res=document.getElementById('res');q=q.trim();if(!q){res.innerHTML='<p class="muted">請輸入關鍵字。</p>';return;}const terms=q.toLowerCase().split(/\s+/).filter(Boolean);const hits=idx.map(it=>{const t=(it.title+' '+it.text).toLowerCase();let s=0;terms.forEach(k=>{if(it.title.toLowerCase().includes(k))s+=3;const c=t.split(k).length-1;s+=c;});return [s,it];}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,30);
if(!hits.length){res.innerHTML='<p>找不到「'+q.replace(/[<>]/g,'')+'」，換個關鍵字試試。</p>';return;}
res.innerHTML='<p class="muted">'+hits.length+' 筆結果</p>'+hits.map(([s,it])=>{let x=it.text;const k=terms[0];const i=x.toLowerCase().indexOf(k);if(i>40)x='…'+x.slice(i-40);x=x.slice(0,160)+(x.length>160?'…':'');return '<div class="panel" style="padding:12px 16px"><a href="'+it.url+'"><b>'+it.title+'</b></a><div class="small">'+it.page+'</div><p style="margin:6px 0 0;font-size:14.5px">'+x.replace(/[<>]/g,'')+'</p></div>';}).join('');}
document.getElementById('sf').addEventListener('submit',e=>{e.preventDefault();history.replaceState(null,'','search.html?q='+encodeURIComponent(inp.value));run(inp.value);});run(q0);})();
</script>
